<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flask & MongoDB</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .error {
            background: #ffe0e0;
            color: #b00000;
            padding: 10px;
            margin-bottom: 15px;
        }

        .api-link {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Flask & MongoDB</h1>

    <p>Submit your data to MongoDB Atlas.</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form action="{{ url_for('submit') }}" method="POST">

        <label>Name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter your name"
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
        >

        <label>Message</label>
        <textarea
            name="message"
            placeholder="Enter your message"
        ></textarea>

        <button type="submit">
            Submit
        </button>

    </form>

    <div class="api-link">
        <a href="{{ url_for('api') }}">
            View JSON API
        </a>
    </div>

</div>

</body>
</html>
